<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Freight Flow Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-shell">
    <h1>Freight Flow Game</h1>

    <div class="hud">
      <div>Score: <span id="score">0</span></div>
      <div>Blocked Bases: <span id="blocked">0</span></div>
      <div>Status: <span id="status">Move freight and keep the flow going.</span></div>
    </div>

    <div class="controls">
      <button id="callGpmButton">Call GPM</button>

      <button id="requestIbtButton">Request New IBT</button>

      <button id="requestPrimaryTrailerButton">Request Primary Trailer</button>
      <button id="requestSecondaryTrailerButton">Request Secondary Trailer</button>

      <button id="togglePrimaryDoorButton">Toggle Primary Door</button>
      <button id="toggleSecondaryDoorButton">Toggle Secondary Door</button>
    </div>

    <canvas id="gameCanvas" width="1200" height="900"></canvas>
  </div>

  <script src="game.js"></script>
</body>
</html>
